name: OICD test connectivity
on:
    workflow_dispatch:
permissions:
    contents: read
    id-token: write

jobs:
    aws_authentication:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v3
            - name: Debug ARN length
              env:
                ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
              run: echo "ARN length is ${#ROLE_ARN}"
            - name: Debug OIDC token contents
              run: |
                  IDTOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
                  echo $IDTOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq .
            - name: configure AWS creds
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: ${{secrets.AWS_ROLE_ARN}}
                aws-region: eu-west-2
                role-session-name: Githublink
            - name: Test OIDC auth
              run: |
                  aws sts get-caller-identity
