name: Build and Test
on:
    workflow_dispatch:
permissions:
    contents: read
    id-token: write

jobs:
    BuildPhase:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v3
            - name: setup java21
              uses: actions/setup-java@v6
              with: 
                distribution: temurin
                java-version: '21'
                cache: maven
            - name: check java version 
              run: java --version
            - name: check mvn version 
              run: mvn --version
            - name: build with maven
              run: mvn clean package
            - name: verify jar file
              run: |
               ls -l target/*.jar
               echo "Build"
            - name: prepare EBS package
              run: |
               mkdir -p eb-deployment
               cp target/*.jar eb-deployment/
               echo "web: java -jar *.jar" > eb-deployment/Procfile
               ls - la eb-deployment
            - name: upload artificat
              uses: actions/upload-artifact@v4
              with: 
                name: streamflix-deployment
                path: eb-deployment