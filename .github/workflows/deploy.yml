name: Build and Test
on:
    workflow_dispatch:
permissions:
    contents: read
    id-token: write

jobs:
    BuildPhase:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v3
            - name: setup java21
              uses: actions/setup-java@v6
              with: 
                distribution: temurin
                java-version: '21'
                cache: maven
            - name: check java version 
              run: java --version
            - name: check mvn version 
              run: mvn --version
            - name: build with maven
              run: mvn clean package
            - name: verify jar file
              run: |
               ls -l target/*.jar
               echo "Build"
            - name: prepare EBS package
              run: |
               mkdir -p eb-deployment
               cp target/*.jar eb-deployment/
               echo "web: java -jar *.jar" > eb-deployment/Procfile
               ls -la eb-deployment
            - name: upload artificat
              uses: actions/upload-artifact@v4
              with: 
                name: streamflix-deployment
                path: eb-deployment

    terraform:
      name: Terraform infra
      runs-on: unbuntu-latest
      needs: BuildPhase
      steps: 
            - name: checkout
              uses: actions/checkout@v3
            - name: configure AWS creds
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: ${{secrets.AWS_ROLE_ARN}}
                aws-region: eu-west-2
                role-session-name: Githublink
            - name: Test OIDC auth
              run: |
                  aws sts get-caller-identity
            - name: setup Terraform
              uses: hashicorp/setup-terraform@v3
            - name: Terraform init
              working-directory: terraform
              run: terraform init
            - name: Terraform plan
              working-directory: terraform
              run: terraform plan
            - name: Terraform apply
              working-directory: terraform
              run: terraform apply -auto-approve

    DeployPhase:
      name: Deploy to elastic beanstalk
      runs-on: ubuntu-latest
      needs: terraform
      steps:
            - name: download artifact
              uses: actions/download-artifact@v4
              with:
                name: streamflix-deployment
                path: deployment
            - name: verify deployment files
              run: |
                echo "Deployment files"
                ls -la deployment
                echo "proc file"
                cat deployment/Procfile
                test -f deployment/Procfile && echo "Procfile exists"
                test -f deployment/*.jar && echo "Jar file exists"
              - name: create a zip file
                run: |
                  cd deployment
                  zip -r ../Streamflixdeployment.zip *
                  cd ..
                  unzip -l Streamflixdeployment.zip
            - name: configure AWS creds
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: ${{secrets.AWS_ROLE_ARN}}
                aws-region: eu-west-2
                role-session-name: Githublink
            - name: Test OIDC auth
              run: |
                  aws sts get-caller-identity

            - name: deploy to elastic beanstalk
              uses: aws-actions/aws-elastic-beanstalk-deploy@v1
              with:
                application-name: streamflix
                environment-name: streamflix-env
                version-label: streamflix-${{ github.run_number }}
                aws-region: eu-west-2
                deployment-package-path: Streamflixdeployment.zip
